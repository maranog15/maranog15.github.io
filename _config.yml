name: Gina Marano
role: "Forest ecologist &middot; Postdoctoral researcher, WSL"
title: Gina Marano
bio: "Forest ecologist and modeller working on drought, disturbance and the dynamics of temperate forests."
description: "Gina Marano — forest ecologist and postdoctoral researcher at WSL. Process-based forest modelling, drought-induced tree mortality and the dynamics of temperate forests."

url: https://ginamarano.com
baseurl: ""

# ---------------------------------------------------------------------------
#  identity / portrait
# ---------------------------------------------------------------------------
external-image: false
picture: /assets/images/portrait.jpg

# ---------------------------------------------------------------------------
