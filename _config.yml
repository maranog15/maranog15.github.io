# CV file served from /assets/docs/ (leave blank to hide the download button)
cv-pdf: /assets/docs/CV_GinaMarano_2026.pdf

# ---------------------------------------------------------------------------
#  build
# ---------------------------------------------------------------------------
timezone: UTC
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# ---------------------------------------------------------------------------
#  files
# ---------------------------------------------------------------------------
include:
  - .htaccess

exclude:
  # retired blog + legacy Indigo theme files (kept on disk, not published)
  - _posts
  - _drafts
  - projects.html
  - tags.html
  - assets/css
  - classes
  - assets/screen-shot.png
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README.*
  - FAQ.md
  - travis.sh
  - .travis.yml
  - tmp
  - TO-DO.*
  - /docs
  - /test
  - /resources

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
