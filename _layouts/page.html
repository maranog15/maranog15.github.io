---
layout: default
---
<div class="frame">
    <article class="content fade-up">
        {% unless page.hide_title %}
            <h1 class="page-title">{{ page.title }}</h1>
            {% if page.lede %}<p class="page-lede">{{ page.lede }}</p>{% endif %}
        {% endunless %}

        {{ content }}
    </article>
</div>
